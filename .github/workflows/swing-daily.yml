name: Swing Daily

# 起動経路は定時実行と手動起動の 2 つだけ。パブリックリポジトリなので
# issue_comment などの第三者が引ける経路は付けない。失敗しても自動再実行は
# せず、手動 dispatch で対応する。
on:
  # UTC 01:17 = JST 火〜土 10:17。米国クローズ (20:00/21:00 UTC) の 4〜5 時間後。
  #
  # 曜日が 2-6 (火〜土) なのは、米国セッションの *翌* UTC 日に走るため。
  # 月〜金のセッションを 1:1 で拾うのがこのマスクで、1-5 にすると金曜の
  # セッションを取り逃して月曜未明に空振りする。
  #
  # クローズの 2 時間後 (旧 23:00 UTC の冬時間) から後ろへ倒した理由は 2 つ:
  #   1. EOD 確定の余裕。当日バーがまだ無いと run_date が前営業日に落ち
  #      (pipeline/daily_runner.py の run_date 解決)、同日再実行ガードが
  #      PREFLIGHT_ABORT[same_day_rerun] を投げてその日の分析が丸ごと落ちる。
  #   2. 旧 23:00 UTC は「自分の収集窓が閉じる前」に走っていた。テキスト側の
  #      上限は run_date の UTC 日末 (text/edgar_filings.py の
  #      `datetime.combine(as_of, datetime.max.time(), tzinfo=UTC)`、
  #      ニュースも to = run_date)。つまり 23:00-24:00 UTC に出た開示・記事は
  #      窓の内側にありながら構造的に取得不能だった。これは遅延ではなく境界の
  #      問題で、待っても直らない。01:17 UTC は窓が閉じた 1 時間 17 分後に走る。
  #      窓の境界も cron も UTC 基準なので、この余裕は夏冬で変わらない。
  #      該当時間帯 (16:00-20:00 ET) は AMC 決算と 8-K が集中する枠でもある。
  #
  # 分は :00 を避けている。GitHub の共有 cron キューは毎正時が最も混む。
  # cron は保証起動ではないので、飛んだ日は手動 dispatch する
  # (欠落は次 run のプリフライトが検知する)。
  schedule:
    - cron: "17 1 * * 2-6"
  # schedule では inputs が空になるため、mode は既定値ではなく
  # `inputs.mode || 'live'` で解決する (定時実行は常に live)。
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run: ライブ DB に触れない試走 / live: 本番の日次実行"
        type: choice
        options:
          - dry-run
          - live
        default: dry-run

permissions:
  contents: read

# 実行中の分析は絶対に殺さない (途中で落ちると R2 への push が走らず、
# その日の分析がまるごと失われる)。後続は待たせる。
concurrency:
  group: swing-daily
  cancel-in-progress: false

jobs:
  daily:
    name: Daily analysis (${{ inputs.mode || 'live' }})
    runs-on: ubuntu-latest
    # swing-daily スキル内部の全体上限が 45 分。データ取得・ingest・
    # R2 の pull/push を足した余裕として 90 分を取る。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      # dev グループは要らない。ops は data_sync.py の boto3。
      - name: Install dependencies
        run: uv sync --locked --group ops

      # R2 が data/ の正本。分析より先に引く。
      - name: Pull data from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run --group ops python scripts/data_sync.py pull

      # 最小権限: 分析セッションには R2 の資格情報を渡さない。
      # API キーはステップの env: で渡す (settings JSON への secrets 埋め込みは
      # 値に含まれる文字次第で JSON が壊れるため不可)。
      # 権限モードは claude_args で CLI に直接渡す (settings の defaultMode は
      # SDK 経由の起動には効かない)。リポジトリの .claude/settings.json
      # (guard/format/stop_check フック) は project スコープとして別途読まれる。
      - name: Run swing-daily
        uses: anthropics/claude-code-action@e2a4b761cd77a1138a5b41410eda9b28581f9bcd # v1.0.196
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude GitHub App は未インストールなので、OIDC 交換ではなく
          # workflow の GITHUB_TOKEN を渡す。Claude は GitHub へ書き込まない。
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--model opus --permission-mode bypassPermissions"
          prompt: |
            これは GitHub Actions 上の無人実行 (headless) です。
            `.claude/skills/swing-daily/SKILL.md` の「無人実行（headless）時の方針」に
            従ってください。ユーザーに質問することはできません。判断が割れる分岐は
            常に保守側 (skip / withhold / 中断) を選んでください。

            ${{ (inputs.mode || 'live') == 'dry-run' && 'swing-daily スキル (`/swing-daily`) を実行してください。ただし `copilot-daily` は `--dry-run` を付けて起動します (`uv run copilot-daily --dry-run`)。dry-run はライブの DuckDB を開かず、`data/copilot_dry_run.duckdb` と `reports/dry_run` にだけ書きます。' || 'swing-daily スキル (`/swing-daily`) を引数なしで実行してください (`uv run copilot-daily`)。これは本番の日次実行です。' }}

            最後に、どこまで進んだか、打ち切った組、縮退・欠落の理由、
            人間が翌朝確認すべき点を要約して報告してください。

      # 失敗した日は push しない = リモート正本は前日のまま。
      # dry-run はライブ DB を触らないので push する対象が無い。
      - name: Push data to R2
        if: ${{ success() && (inputs.mode || 'live') == 'live' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run --group ops python scripts/data_sync.py push

      # 分析セッションはほとんど何も書かないまま "success" で終わることがある。
      # データを先に push してから落とすので、その日の価格・ファンダメンタルズ・
      # 台帳は残り、定性分析だけを後からローカルの /swing-daily で仕上げられる。
      - name: Verify the analysis completed
        if: ${{ success() && (inputs.mode || 'live') == 'live' }}
        run: uv run python scripts/check_daily_complete.py

      # 失敗した日ほどレポートを見たいので always()。
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swing-daily-reports-${{ inputs.mode || 'live' }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
