name: Swing Daily

# 起動経路は定時実行と手動起動の 2 つだけ。パブリックリポジトリなので
# issue_comment などの第三者が引ける経路は付けない。失敗しても自動再実行は
# せず、手動 dispatch で対応する。
on:
  # UTC 01:17 = JST 火〜土 10:17。米国クローズ (20:00/21:00 UTC) の 4〜5 時間後。
  #
  # 曜日が 2-6 (火〜土) なのは、米国セッションの *翌* UTC 日に走るため。
  # 月〜金のセッションを 1:1 で拾うのがこのマスクで、1-5 にすると金曜の
  # セッションを取り逃して月曜未明に空振りする。
  #
  # クローズの 2 時間後 (旧 23:00 UTC の冬時間) から後ろへ倒した理由は 2 つ:
  #   1. EOD 確定の余裕。当日バーがまだ無いと run_date が前営業日に落ち
  #      (pipeline/daily_runner.py の run_date 解決)、同日再実行ガードが
  #      PREFLIGHT_ABORT[same_day_rerun] を投げてその日の分析が丸ごと落ちる。
  #   2. 旧 23:00 UTC は「自分の収集窓が閉じる前」に走っていた。テキスト側の
  #      上限は run_date の UTC 日末 (text/edgar_filings.py の
  #      `datetime.combine(as_of, datetime.max.time(), tzinfo=UTC)`、
  #      ニュースも to = run_date)。つまり 23:00-24:00 UTC に出た開示・記事は
  #      窓の内側にありながら構造的に取得不能だった。これは遅延ではなく境界の
  #      問題で、待っても直らない。01:17 UTC は窓が閉じた 1 時間 17 分後に走る。
  #      窓の境界も cron も UTC 基準なので、この余裕は夏冬で変わらない。
  #      該当時間帯 (16:00-20:00 ET) は AMC 決算と 8-K が集中する枠でもある。
  #
  # 分は :00 を避けている。GitHub の共有 cron キューは毎正時が最も混む。
  # cron は保証起動ではないので、飛んだ日は手動 dispatch する
  # (欠落は次 run のプリフライトが検知する)。
  schedule:
    - cron: "17 1 * * 2-6"
  # schedule では inputs が空になるため、mode は既定値ではなく
  # `inputs.mode || 'live'` で解決する (定時実行は常に live)。
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run: ライブ DB に触れない試走 / live: 本番の日次実行"
        type: choice
        options:
          - dry-run
          - live
        default: dry-run

permissions:
  contents: read

# 実行中の分析は絶対に殺さない (途中で落ちると R2 への push が走らず、
# その日の分析がまるごと失われる)。後続は待たせる。
concurrency:
  group: swing-daily
  cancel-in-progress: false

jobs:
  daily:
    name: Daily analysis (${{ inputs.mode || 'live' }})
    runs-on: ubuntu-latest
    # swing-daily スキル内部の全体上限が 45 分。データ取得・ingest・
    # R2 の pull/push を足した余裕として 90 分を取る。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # copilot-daily 自身がこの環境変数をフォールバックとして読む
      # (`--outcome-file` が渡ればそちらを優先。pipeline/daily_composition.py)。
      # 以降の全ステップに効かせることで、分析セッションが素で
      # `uv run copilot-daily` を叩いても、preflight abort を含む全終了経路で
      # outcome ファイルが書かれる (Issue #372。プロンプト指示への依存を避ける
      # ための設計)。
      #
      # job の env: には置けない。`runner` コンテキストはステップの中でしか
      # 参照できず、job レベルの env: で使うとワークフローファイル自体が
      # 受理されず job が1つも作られないまま run が failure になる
      # (startup failure。Issue #380)。GITHUB_ENV 経由なら同じ「job 全体に
      # 効く」性質を保ったまま RUNNER_TEMP を解決できる。
      - name: Export the daily outcome file path
        run: |
          echo "COPILOT_DAILY_OUTCOME_FILE=$RUNNER_TEMP/copilot-daily-outcome.json" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"

      # dev グループは要らない。ops は data_sync.py の boto3。
      - name: Install dependencies
        run: uv sync --locked --group ops

      # R2 が data/・reports/ の正本。分析より先に引く。
      # reports/ は日次runアーカイブが単調増加する (Issue #370)。まっさらな
      # ランナーの pull コストを定数に保つため、--reports-window で直近10
      # run date だけ取得する (data/ は常に全件)。窓は state ファイルに記録され、
      # 後段の push はそこから reports/ の GC 抑止と append-only の判定範囲を
      # 導出する (Issue #373)。窓外アーカイブへの訂正の再取り込みは運用者の
      # ローカル全件 pull -> collect -> push (--reports-append-only なし) が担う。
      - name: Pull data from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run --group ops python scripts/data_sync.py pull --reports-window 10

      # reports/ を R2 から引いた直後は、過去日の analysis_result.json も
      # ワークスペースに存在する。check_daily_complete.py の --started-after が
      # 「このジョブ自身の run」だけを検証対象にできるよう、ここで開始時刻を
      # 記録しておく (Issue #370、Part 3)。
      - name: Record job start time
        id: job_start
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # 最小権限: 分析セッションには R2 の資格情報を渡さない。
      # API キーはステップの env: で渡す (settings JSON への secrets 埋め込みは
      # 値に含まれる文字次第で JSON が壊れるため不可)。
      # 権限は claude_args で CLI に直接渡す (settings の defaultMode や
      # permissions は SDK 経由の起動には効かない)。リポジトリの
      # .claude/settings.json (guard/format/stop_check フックと、この同じ狭い
      # コマンド許可リスト) は project スコープとして別途読まれる。
      #
      # dontAsk: 承認待ちで止まらず、許可されていないツール呼び出しは拒否して続行する。
      # 許可するのは swing-daily スキルが実際に使うコマンドだけで、`uv run` 全体には
      # 広げない (`uv run python ...` が任意コード実行になり、ニュース・開示という
      # 信頼できないテキストを読むセッションで injection 耐性が消えるため)。
      # 同じ理由で、実行経路になるファイル (src/、scripts/、config/、ビルド定義、
      # .claude/、.github/) への書き込みを拒否する。スキルが書くのは
      # reports/<run_id>/ 配下の断片と `.swing-daily-scratch/` の一時ファイルだけ。
      - name: Run swing-daily
        id: claude
        uses: anthropics/claude-code-action@e2a4b761cd77a1138a5b41410eda9b28581f9bcd # v1.0.196
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude GitHub App は未インストールなので、OIDC 交換ではなく
          # workflow の GITHUB_TOKEN を渡す。Claude は GitHub へ書き込まない。
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model opus
            --permission-mode dontAsk
            --allowedTools
            "Bash(uv run copilot-daily:*),Bash(uv run copilot-verify-analysis:*),Bash(uv run copilot-ingest-analysis:*),Bash(uv run copilot-history:*),Bash(uv run copilot-export-slices:*),Bash(./scripts/timebox.sh:*),Write,Edit"
            --disallowedTools
            "WebFetch,WebSearch,Write(src/**),Edit(src/**),Write(scripts/**),Edit(scripts/**),Write(config/**),Edit(config/**),Write(.claude/**),Edit(.claude/**),Write(.github/**),Edit(.github/**),Write(pyproject.toml),Edit(pyproject.toml),Write(justfile),Edit(justfile)"
          prompt: |
            これは GitHub Actions 上の無人実行 (headless) です。
            `.claude/skills/swing-daily/SKILL.md` の「無人実行（headless）時の方針」に
            従ってください。ユーザーに質問することはできません。判断が割れる分岐は
            常に保守側 (skip / withhold / 中断) を選んでください。

            Bash の使用は次の6つの形に限定します。`uv run copilot-daily`、
            `uv run copilot-verify-analysis`、`uv run copilot-ingest-analysis`、
            `uv run copilot-history`、`uv run copilot-export-slices`、
            `./scripts/timebox.sh` のいずれかで始まるコマンドだけを使ってください。
            作業ディレクトリはリポジトリルートです。`cd`、`env`、`export`、`bash`、
            `sh`、`git`、`python`、`cat`、`ls`、`find`、`sed`、`rm`、`cp`、`mv`、
            `mkdir`、`sleep`、`date`、`echo`、および `&&`・`|`・`;`・リダイレクト等の
            前置きやシェル演算子は使わないでください。ファイルの読み取りは
            Read / Glob / Grep、書き込みは Write / Edit を使います。許可済みコマンドも
            前置きなしで直接呼び出してください。

            ${{ (inputs.mode || 'live') == 'dry-run' && 'swing-daily スキル (`/swing-daily`) を実行してください。ただし `copilot-daily` は `--dry-run` を付けて起動します (`uv run copilot-daily --dry-run`)。dry-run はライブの DuckDB を開かず、`data/copilot_dry_run.duckdb` と `reports/dry_run` にだけ書きます。' || 'swing-daily スキル (`/swing-daily`) を引数なしで実行してください (`uv run copilot-daily`)。これは本番の日次実行です。' }}

            最後に、どこまで進んだか、打ち切った組、縮退・欠落の理由、
            人間が翌朝確認すべき点を要約して報告してください。

      # The action deliberately hides the full execution JSON because it can contain
      # untrusted filing/news text and secrets. Keep only a safe aggregate of denied
      # tool classes so a dontAsk regression is diagnosable without exposing commands
      # or paths in the public Actions log.
      - name: Summarize Claude permission denials
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from collections import Counter
          from pathlib import Path

          execution_file = os.environ.get("EXECUTION_FILE", "")
          if not execution_file:
              print("permission_denials_summary=unavailable:no_execution_file")
              raise SystemExit(0)

          try:
              messages = json.loads(Path(execution_file).read_text())
          except (OSError, json.JSONDecodeError):
              print("permission_denials_summary=unavailable:unreadable_execution_file")
              raise SystemExit(0)

          result_messages = [
              message
              for message in messages
              if message.get("type") == "result"
          ]
          denials = [
              denial
              for message in result_messages
              for denial in message.get("permission_denials", [])
          ]

          def classify(denial: object) -> str:
              if not isinstance(denial, dict):
                  return "unknown"
              tool_name = denial.get("tool_name", "unknown")
              if tool_name != "Bash":
                  return str(tool_name)
              input_value = denial.get("tool_input", denial.get("input", {}))
              command = input_value.get("command", "") if isinstance(input_value, dict) else ""
              command = str(command).strip()
              if re.search(r"\buv run copilot-daily\b", command):
                  return "Bash:uv-run-copilot-daily-with-prefix"
              if re.search(r"\buv run copilot-verify-analysis\b", command):
                  return "Bash:uv-run-copilot-verify-analysis-with-prefix"
              if re.search(r"\buv run copilot-ingest-analysis\b", command):
                  return "Bash:uv-run-copilot-ingest-analysis-with-prefix"
              if re.search(r"\buv run copilot-history\b", command):
                  return "Bash:uv-run-copilot-history-with-prefix"
              if re.search(r"\buv run copilot-export-slices\b", command):
                  return "Bash:uv-run-copilot-export-slices-with-prefix"
              if re.search(r"(?:^|[;&|]\s*)\.\.?/scripts/timebox\.sh\b", command):
                  return "Bash:timebox-with-prefix"
              if re.search(r"\buv run\b", command):
                  return "Bash:uv-run-other"
              if re.search(
                  r"(?:^|[;&|]\s*)(?:pwd|ls|cat|head|tail|rg|grep|find|sed)\b",
                  command,
              ):
                  return "Bash:read-only-other"
              if re.search(
                  r"(?:^|[;&|]\s*)(?:git|rm|mv|cp|mkdir|touch)\b",
                  command,
              ):
                  return "Bash:filesystem-or-git"
              if re.search(r"(?:^|[;&|]\s*)(?:cd|export|env|bash|sh)\b", command):
                  return "Bash:shell-wrapper"
              if re.search(
                  r"^(?:if|for|while|case|source|set|echo|printf|test|sleep|date|"
                  r"python|python3|jq|awk|timeout|which|command|true|false)\b",
                  command,
              ):
                  return "Bash:common-shell-or-script"
              return "Bash:other"

          print(f"permission_denials_count={len(denials)}")
          for category, count in sorted(Counter(map(classify, denials)).items()):
              print(f"permission_denials[{category}]={count}")
          PY

      # 2026-08-29 の欠落 (Issue #372) は、事後にセッションの挙動を確認する
      # 手段が無かったこと自体が診断を遅らせた欠陥だった。execution_file には
      # ニュース・開示という信頼できないテキストや秘密情報が含まれ得るため、
      # 上のサマリと違って中身は公開ログへ出さず、artifact としてのみ残す
      # (14日保持、他の workflow artifact と揃える)。always(): 落ちた日ほど
      # 診断に要る。
      # `execution_file != ''` は if-no-files-found では代替できない:
      # upload-artifact の `path` は required 入力なので、claude ステップが
      # skip された (前段の R2 pull 失敗など) 場合の空文字は「見つからない」
      # ではなく入力エラーになる。上の集計ステップが同じ空判定を持つのと同じ理由。
      - name: Upload Claude execution log
        if: ${{ always() && steps.claude.outputs.execution_file != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swing-daily-execution-${{ inputs.mode || 'live' }}
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 14

      # 設計判断 D2 (docs/goal-prompts/swing-copilot-retrospective/decisions.md)
      # により copilot-ingest-analysis は DB に触れない。verdicts/verdict_sources
      # への書き込みは copilot-retro collect が reports/ を走査して行う唯一の経路
      # だが、無人実行経路でこれを実際に走らせる場所がこれまで存在せず、CI で
      # 生成した run の verdict がランナー破棄と同時に失われていた
      # (Issue #370)。R2 への push 前にここで一度だけ実行し、今日の verdict を
      # data/copilot.duckdb に取り込んでから push に載せる。
      #
      # continue-on-error: この工程の失敗でその日の価格・ファンダメンタルズ・
      # 台帳まで道連れにしない。push は success() ゲートなので、ここで落ちると
      # R2 への書き戻し自体が飛び、収集済みデータがランナーごと消える
      # (この工程を入れるまで、分析と push の間に落ちうるステップは無かった)。
      # reports/ が R2 同期対象になった今、取り込みそこねた日は後から
      # `copilot-retro collect` を回せば拾い直せる = 遅延は可逆・データ喪失は不可逆。
      - name: Collect verdicts into the database
        if: ${{ success() && (inputs.mode || 'live') == 'live' }}
        continue-on-error: true
        run: uv run copilot-retro collect

      # 失敗した日は push しない = リモート正本は前日のまま。
      # dry-run はライブ DB を触らないので push する対象が無い。
      #
      # --reports-append-only: 分析セッションは reports/ 配下に Write/Edit でき、
      # かつニュース・開示という信頼できないテキストを読む。reports/ が同期対象に
      # なったことで、そのセッションのワークスペースには過去日のアーカイブ全体が
      # 載るようになった = injection で過去の analysis_result.json を書き換えられ、
      # digest ベースの collect がそれを再取り込みし、push で R2 に固定される、
      # という経路が新たに生まれる。無人実行では「新しい run ディレクトリの追加は
      # 許すが、既存オブジェクトの変更・削除は許さない」に絞ってこれを塞ぐ。
      # ローカルからの手動 push には付けない (アーカイブを訂正して再取り込みする
      # のは設計上サポートされた運用であり、collect の digest 走査はそのためにある)。
      - name: Push data to R2
        if: ${{ success() && (inputs.mode || 'live') == 'live' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          uv run --group ops python scripts/data_sync.py push
          --reports-append-only

      # 分析セッションはほとんど何も書かないまま "success" で終わることがある。
      # データを先に push してから落とすので、その日の価格・ファンダメンタルズ・
      # 台帳は残る。定性分析の実行経路はこの GitHub Actions job だけとする。
      # reports/ も R2 から同期されるようになった (Issue #370) ため、過去日の
      # analysis_result.json がワークスペースに残っていて「このジョブは何も
      # 走らせていないのに前日分で緑になる」誤検知を防ぐには、--started-after で
      # このジョブ自身の run に絞り込む必要がある。
      - name: Verify the analysis completed
        if: ${{ success() && (inputs.mode || 'live') == 'live' }}
        env:
          # Routed through env: rather than interpolated straight into the
          # run: script, so this step output can never expand into shell code.
          STARTED_AFTER: ${{ steps.job_start.outputs.started_at }}
        run: >-
          uv run python scripts/check_daily_complete.py
          --started-after "$STARTED_AFTER"
          --outcome-file "$COPILOT_DAILY_OUTCOME_FILE"

      # Issue #383: 定性 verdict 確定後に毎日1通だけ Discord へ通知する。
      # 旧来は copilot-daily 内の step 7 (`_run_step_notify`) が
      # `6_analysis_export` の直後に送っていたが、その時点では
      # verdict がまだ存在しない (skill が analysis_result.json を書き、
      # copilot-ingest-analysis が検証するのはその後) ため、通知は常に
      # 「候補N件」としか言えなかった。ここへ移すことで、verdict が
      # 確定した後の本当の結論 (proceed の売買計画、全件 skip、縮退・
      # withhold) を伝えられる。
      #
      # always(): 「Verify the analysis completed」が落ちた日、あるいは
      # それより前のどのステップが落ちた日も、必ず1通は届けるのが要件
      # (scripts/notify_daily.py と report/verdict_notification.py が
      # outcome ファイルの有無・内容だけから終了区分を判定する)。
      # continue-on-error: true で、通知の失敗が R2 push 済みのデータ
      # (この時点で既に完了している) を道連れにしない。
      # DISCORD_WEBHOOK_URL は「Run swing-daily」ステップの env: にしか
      # 無いため、ここにも渡す。
      - name: Send the daily verdict notification
        if: ${{ always() && (inputs.mode || 'live') == 'live' }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run python scripts/notify_daily.py

      # 失敗した日ほどレポートを見たいので always()。
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swing-daily-reports-${{ inputs.mode || 'live' }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
