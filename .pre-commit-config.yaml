repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: v1.44.0
    hooks:
      - id: typos
        args: ["--config", "typos.toml"]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.26.1
    hooks:
      - id: zizmor

  # zizmor はワークフローの「安全性」を見るが、GitHub がそのファイルを
  # 受理するかどうかは見ない。Issue #380 の startup failure (job レベルの
  # env: で `runner` コンテキストを参照し、run が job 0 件で failure になる)
  # は yaml.safe_load も zizmor も通り抜けた。actionlint はこれを式の
  # コンテキスト検査で捕まえる。
  #
  # shellcheck / pyflakes への委譲は切ってある。PATH にそれらが在るかどうかで
  # 結果が変わるフックは、ローカルと CI で挙動が割れる。ここで欲しいのは
  # 「ワークフローファイルが妥当か」の判定だけである。
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ["-shellcheck=", "-pyflakes="]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src scripts tests
        language: system
        types: [python]
        pass_filenames: false
