universe:
  index: "sp500"
  refresh_interval_days: 7 # >= 1
  snapshot_path: "config/universe_snapshot.csv"
  manual_include: [] # ticker symbols to force-include
  manual_exclude: [] # ticker symbols to force-exclude

risk:
  account_equity_usd: null # unset -> position sizing returns not_calculable
  max_position_pct: 0.10 # 1 symbol <= 10% of equity
  max_trade_risk_pct: 0.01 # 1 trade risk <= 1% of equity (stop-distance based)
  max_sector_pct: 0.30 # same-sector exposure cap
  max_correlation: 0.7 # warn (do not block) above this Pearson correlation
  correlation_lookback_days: 60
  max_portfolio_heat_pct: 6.0 # %; roadmap §5 P4-17（要検証）
  earnings_block_business_days: 2 # weekdays; roadmap §5 P4-18（要検証）
  earnings_warn_business_days: 5 # weekdays; roadmap §5 P4-18（要検証）
  circuit_daily_loss_pct: 2.0 # realized loss %; roadmap §5 P4-19（要検証）
  circuit_weekly_loss_pct: 5.0 # realized loss %; roadmap §5 P4-19（要検証）
  circuit_monthly_loss_pct: 8.0 # realized loss %; roadmap §5 P4-19（要検証）
  circuit_consecutive_losses: 2 # roadmap §5 P4-19（要検証）
  circuit_cooldown_hours: 24 # hours since latest losing close; roadmap §5 P4-19（要検証）
  wide_stop_threshold_pct: 10.0 # % of entry price; WIDE_STOP warning above this (要検証)

fundamental_filters:
  min_profitable_quarters: 4 # >= 1; net_income > 0 for the last N quarters
  require_positive_fcf: true
  min_equity_ratio: 0.30 # fraction in [0, 1]

technical_signals:
  trend:
    sma_short: 50 # >= 1 and strictly less than sma_long
    sma_long: 200 # >= 1
  pullback:
    rsi_period: 14 # >= 1
    rsi_threshold: 45 # closed interval [0, 100]
    sma_band_pct: 0.03 # fraction in [0, 1]
  volume:
    avg_volume_days: 20 # >= 1
    min_avg_volume: 1000000 # >= 0
  minervini:
    # roadmap §5 P5-21; RS threshold and weights are 要検証.
    sma200_rising_days: 22
    min_low_multiple: 1.25
    min_high_multiple: 0.75
    min_rs_percentile: 70.0
    rs_weight_63d: 0.40
    rs_weight_126d: 0.20
    rs_weight_189d: 0.20
    rs_weight_252d: 0.20
  execution:
    # roadmap §5 P5-23（要検証）: d=(close-SMA50)/ATR14 thresholds.
    damaged_max_d: -3.0
    fair_max_d: 2.0
    extended_max_d: 4.0
  vcp:
    # roadmap §5 P5-24（全値要検証）
    zigzag_atr_multiplier: 2.0
    first_depth_min: 0.08
    first_depth_max: 0.35
    small_cap_first_depth_max: 0.50
    contraction_ratio_max: 0.75
    min_contractions: 2
    pattern_days_min: 15
    pattern_days_max: 325
    dry_up_ideal_max: 0.30
    dry_up_weak_min: 0.70
    chase_pivot_pct: 0.05

backtest:
  initial_cash_usd: 100000
  entry: "next_open"
  exit_atr_multiple: 2.5
  exit_atr_period: 14
  max_hold_days: 60
  commission_pct: 0.001
  slippage_pct: 0.001
  benchmark: "SPY"

analysis:
  # Bounds on the untrusted text exported to analysis_input.json for the
  # swing-daily skill (docs/06_reliability_roadmap.md §5 P6-26).
  max_news_items_per_symbol: 20
  max_news_chars_per_item: 4000
  # Per-filing export budget (single setting; formerly filing_chunk_chars *
  # max_filing_chunks).
  max_filing_chars: 120000
  # Combined filing-text budget for one symbol / filing-analysis context.
  max_filing_chars_per_symbol: 240000
  # Filing collection recency bound (days) and per-symbol count cap.
  filing_lookback_days: 90
  max_filings_per_symbol: 3
  # Run-wide macro/economic-calendar events surfaced in context.calendar_events.
  max_calendar_events: 20
  max_calendar_chars_per_item: 2000

schedule:
  timeout_minutes: 35 # >= 1

notification:
  enabled: false # Discord notification is opt-in; set DISCORD_WEBHOOK_URL to use it

regime:
  # roadmap §5 P3-13（要検証）: code-owned market gate and DD thresholds.
  ema_period: 50
  bull_vix_max: 20.0
  bear_spy_ema_ratio: 0.97
  bear_vix_min: 30.0
  distribution_window_days: 25
  dd_decline_pct: -0.002
  stall_abs_change_pct: 0.001
  recovery_pct: 0.05
  reduce_only_risk_multiplier: 0.5 # REDUCE_ONLY trade-risk multiplier (要検証)
  # roadmap §5 P3-16（要検証）: FTD is display-only, never an exposure input.
  ftd_correction_decline_pct: 0.03
  ftd_correction_down_days: 3
  ftd_gain_pct: 0.0125

retro:
  # roadmap §5 P8-31（要検証）: how many MISS_SEVERE symbols get a full
  # evidence dossier in retro_input.json. Overflow is truncated by
  # |forward_return| and the dropped count is reported.
  max_surprises: 5
  # Reserved (D10): the retrospective skill applies L1 proposals without
  # prior approval today. `manual` is a future switch, not yet read.
  approval_mode: auto
