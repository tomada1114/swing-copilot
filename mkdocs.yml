site_name: swing-copilot
site_description: Local decision-support tooling for U.S. stock swing trading.
site_url: https://tomada1114.github.io/swing-copilot
repo_url: https://github.com/tomada1114/swing-copilot
repo_name: tomada1114/swing-copilot
edit_uri: edit/main/docs/

exclude_docs: |
  goal-prompts/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Product Design:
      - Human Preparation: 00_human_preparation.md
      - Requirements: 01_requirements.md
      - Project Plan: 02_project_plan.md
      - Basic Design: 03_basic_design.md
      - Detailed Design: 04_detailed_design.md
      - UI Design: 05_ui_design.md
      - Reliability Roadmap: 06_reliability_roadmap.md
      - Invariant Test Matrix: 07_invariant_test_matrix.md
  - Getting Started: getting-started.md
  - API Reference: reference.md
  - Contributing: contributing.md
